server:
  port: 8080
  host: "0.0.0.0"

vectordb:
  provider: "qdrant"
  url: "http://localhost:6333"
  api_key: ""
  collection: "spark-rag"

embedding:
  provider: "ollama"
  model: "nomic-embed-text"
  api_key: ""

llm:
  provider: "ollama"
  url: "http://localhost:11434"
  model: "mistral"
  api_key: ""
  max_tokens: 2048
  temperature: 0.7

retriever:
  top_k: 5
  chunk_size: 512
  chunk_overlap: 50
  reranker_enabled: false
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-12-v2"
  strategy: "similarity"
  score_threshold: 0.5

logging:
  level: "info"
  json: false
