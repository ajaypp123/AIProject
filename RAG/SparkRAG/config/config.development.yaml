# Spark RAG - Development Configuration
# Used for local development with Ollama (all local, no API keys needed)

server:
  port: 8080
  host: "0.0.0.0"

llm:
  provider: "ollama"
  url: "http://localhost:11434"
  model: "mistral"
  api_key: ""
  max_tokens: 2048
  temperature: 0.7

# ingestor configuration
vectordb:
  provider: "chroma-local"
  url: "/tmp/chroma_db"
  api_key: ""
  collection: "spark-rag"

embedding:
  provider: "sentence-transformers"
  model: "sentence-transformers/all-MiniLM-L6-v2"
  api_key: ""
  url: ""
  batch_size: 32

chunking:
  top_k: 5
  chunk_size: 512
  chunk_overlap: 50
  reranker_enabled: false
  reranker_model: ""
  strategy: "similarity"
  score_threshold: 0.5

ingestion:
  watch_dir: "/home/ajayp/code/AIProject/RAG/SparkRAG/data"
  checkpoint: "/tmp/.ingestor.json"
  skip_existing: true

logging:
  level: "INFO"
